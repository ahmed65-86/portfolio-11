<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بحبك يا ملوكتي 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      color: #fff;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* خلفية القلوب المضيئة المتطايرة */
    .floating-heart {
      position: absolute;
      bottom: -50px;
      color: rgba(255, 105, 180, 0.7);
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255, 182, 193, 0.8));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.4) rotate(360deg);
        opacity: 0;
      }
    }

    /* شاشة البداية باللون الوردي الساحر */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
      box-shadow: inset 0 0 100px rgba(255, 255, 255, 0.3);
    }

    .heart-btn {
      font-size: 100px;
      cursor: pointer;
      animation: pulse 1.2s infinite, sparkle 2s infinite alternate;
      user-select: none;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    @keyframes sparkle {
      0% { filter: drop-shadow(0 0 15px #fff) drop-shadow(0 0 30px #ff1493); }
      100% { filter: drop-shadow(0 0 25px #fff) drop-shadow(0 0 50px #ff69b4); }
    }

    .click-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
      background: rgba(255, 255, 255, 0.2);
      padding: 12px 25px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }

    /* المحتوى الرئيسي */
    #main-content {
      display: none;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 30px;
      max-width: 500px;
      margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
    }

    h1 {
      color: #ffffff;
      font-size: 38px;
      text-shadow: 2px 2px 8px rgba(219, 112, 147, 0.8);
      margin-bottom: 15px;
    }

    p {
      color: #fff0f5;
      font-size: 22px;
      line-height: 1.6;
      font-weight: 600;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    img {
      border-radius: 20px;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 25px rgba(255, 20, 147, 0.4);
      max-width: 100%;
      height: auto;
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.03);
    }

    /* زر الموسيقى العائم */
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      color: #ff1493;
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- شاشة القلب الوردي النابض -->
  <div id="start-screen" onclick="openSite()">
    <div class="heart-btn">💖</div>
    <div class="click-text">اضغطي هنا يا ملوكتي عشان تفتحي المفاجأة ✨</div>
  </div>

  <!-- الأغنية الرومانسية -->
  <audio id="bg-music" src="song.mp3" loop></audio>

  <!-- زر التحكم بالموسيقى -->
  <div class="music-control" id="music-btn" onclick="toggleMusic()" style="display: none;">
    🎵 <span id="music-text">إيقاف الموسيقى</span>
  </div>

  <!-- محتوى الموقع الأساسي -->
  <div id="main-content">
    <div class="card">
      <h1>بحبك يا ملوكتي 💖</h1>
      <p>انتي أحلى حاجة حصلت في حياتي وبموت فيكي 💕✨</p>
      <img src="LOVE.jpeg" width="300" alt="ملوكة">
    </div>
  </div>

  <script>
    // إنشاء القلوب المتطايرة والمستمرة
    function createHearts() {
      const heartContainer = document.body;
      const heartSymbols = ['💖', '💗', '💓', '💕', '🌸', '✨'];
      
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
        
        heartContainer.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }, 300);
    }

    createHearts();

    function openSite() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('music-btn').style.display = 'flex';
      
      var music = document.getElementById('bg-music');
      music.play().catch(function(error) {
        console.log("إذن الصوت مطلوب");
      });
    }

    function toggleMusic() {
      var music = document.getElementById('bg-music');
      var musicText = document.getElementById('music-text');
      if (music.paused) {
        music.play();
        musicText.innerText = "إيقاف الموسيقى";
      } else {
        music.pause();
        musicText.innerText = "تشغيل الموسيقى";
      }
    }
  </script>

</body>
</html>
